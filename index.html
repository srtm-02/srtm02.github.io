<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好きな顔ソート (好き顔9選)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin-bottom: 8px; color: #333; }
    p.sub { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
    
    /* 選択エリア */
    .comparison-box {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    .card {
      flex: 1;
      background: #fafafa;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:active {
      transform: scale(0.97);
      border-color: #ff4757;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
    }
    .card p {
      margin: 8px 0 0;
      font-weight: bold;
      font-size: 0.95rem;
      color: #2d3748;
    }

    /* 9選結果画面 */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
      background: #111;
      padding: 8px;
      border-radius: 12px;
    }
    .result-item {
      position: relative;
      background: #222;
      border-radius: 6px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .result-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .rank-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .result-name {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 10px;
      padding: 2px 0;
      text-align: center;
    }

    .hidden { display: none; }
    .btn {
      width: 100%;
      padding: 12px;
      background: #ff4757;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>好きな顔ソート</h1>

  <!-- 比較画面 -->
  <div id="sort-screen">
    <p class="sub">直感で好きな方を選択してください</p>
    <div class="comparison-box">
      <div class="card" id="card-left">
        <img id="img-left" src="" alt="A">
        <p id="name-left"></p>
      </div>
      <div class="card" id="card-right">
        <img id="img-right" src="" alt="B">
        <p id="name-right"></p>
      </div>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result-screen" class="hidden">
    <h1>❤️ 好き顔9選 ❤️</h1>
    <div class="result-grid" id="result-grid"></div>
    <button class="btn" onclick="location.reload()">もう一度やる</button>
  </div>
</div>

<script>
// ==========================================
// 1. メンバー一覧（画像URLと名前を設定）
// ==========================================
const items = [
  { name: "メンバー1", img: "https://via.placeholder.com/300?text=1" },
  { name: "メンバー2", img: "https://via.placeholder.com/300?text=2" },
  { name: "メンバー3", img: "https://via.placeholder.com/300?text=3" },
  { name: "メンバー4", img: "https://via.placeholder.com/300?text=4" },
  { name: "メンバー5", img: "https://via.placeholder.com/300?text=5" },
  { name: "メンバー6", img: "https://via.placeholder.com/300?text=6" },
  { name: "メンバー7", img: "https://via.placeholder.com/300?text=7" },
  { name: "メンバー8", img: "https://via.placeholder.com/300?text=8" },
  { name: "メンバー9", img: "https://via.placeholder.com/300?text=9" },
  { name: "メンバー10", img: "https://via.placeholder.com/300?text=10" }
];

let resolveChoice = null;

function askUser(itemA, itemB) {
  return new Promise((resolve) => {
    document.getElementById('img-left').src = itemA.img;
    document.getElementById('name-left').textContent = itemA.name;
    document.getElementById('img-right').src = itemB.img;
    document.getElementById('name-right').textContent = itemB.name;
    resolveChoice = resolve;
  });
}

document.getElementById('card-left').addEventListener('click', () => {
  if (resolveChoice) resolveChoice('left');
});

document.getElementById('card-right').addEventListener('click', () => {
  if (resolveChoice) resolveChoice('right');
});

// 二分比較ソート (マージソート)
async function mergeSort(arr) {
  if (arr.length <= 1) return arr;
  const mid = Math.floor(arr.length / 2);
  const left = await mergeSort(arr.slice(0, mid));
  const right = await mergeSort(arr.slice(mid));
  return await merge(left, right);
}

async function merge(left, right) {
  let result = [];
  let l = 0, r = 0;
  while (l < left.length && r < right.length) {
    const choice = await askUser(left[l], right[r]);
    if (choice === 'left') {
      result.push(left[l]);
      l++;
    } else {
      result.push(right[r]);
      r++;
    }
  }
  return result.concat(left.slice(l)).concat(right.slice(r));
}

// ソート開始
async function startSort() {
  // シャッフルしてランダムな並び順でスタート
  const shuffled = [...items].sort(() => Math.random() - 0.5);
  const sorted = await mergeSort(shuffled);
  showResults(sorted);
}

// 9選結果表示
function showResults(sortedItems) {
  document.getElementById('sort-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');

  const grid = document.getElementById('result-grid');
  grid.innerHTML = '';

  const top9 = sortedItems.slice(0, 9);
  top9.forEach((item, index) => {
    const div = document.createElement('div');
    div.className = 'result-item';
    div.innerHTML = `
      <span class="rank-badge">${index + 1}</span>
      <img src="${item.img}" alt="${item.name}">
      <div class="result-name">${item.name}</div>
    `;
    grid.appendChild(div);
  });
}

startSort();
</script>
</body>
</html>
