
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ワートリ好き顔メーカー</title>
  <meta name="description" content="ワールドトリガーの好きな顔を100回選んで、自分だけの好き顔9選を作ろう。">

  <link rel="stylesheet" href="css/style.css">

  <script src="js/members.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>

<body>
  <header class="site-header">
    <p class="eyebrow">MY FAVORITE FACES</p>
    <h1>ワートリ好き顔メーカー</h1>
    <p>好きな顔を100回選んで、自分だけの好き顔9選を作ろう。</p>
  </header>

  <main class="container">
    <section id="duel-mode" class="panel">
      <h2>ワートリ好き顔メーカー</h2>
      <p class="subtext">
        四択・三択・二択を合計100回！
        直感で好きな人を1人ずつ選んでね。
        選んだポイントを集計して、上位9人を決定するよ。
      </p>

      <div class="duel-progress">
        <span id="duel-progress-text">選択 0 / 100</span>
        <div class="progress-track">
          <div id="duel-progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <div id="duel-cards" class="duel-cards"></div>

      <p id="duel-message" class="message" aria-live="polite"></p>

      <div class="button-row">
        <button
          id="duel-restart-button"
          type="button"
          class="button secondary"
        >
          最初からやり直す
        </button>

        <button
          id="duel-finish-button"
          type="button"
          class="button primary"
          disabled
        >
          結果を見る
        </button>
      </div>
    </section>

    <section id="result-section" class="panel result-panel" hidden>
      <div id="result-capture">
        <p class="eyebrow">MY TOP 9</p>
        <h2>わたしの好き顔9選</h2>
        <p id="result-subtitle" class="subtext">ワートリ好き顔メーカー</p>

        <div id="result-grid" class="result-grid"></div>

        <p class="result-credit">ワートリ好き顔メーカー</p>
      </div>

      <div class="button-row">
        <button
          id="edit-result-button"
          type="button"
          class="button secondary"
        >
          診断結果に戻る
        </button>

        <button
          id="copy-button"
          type="button"
          class="button secondary"
        >
          テキストをコピー
        </button>

        <button
          id="save-button"
          type="button"
          class="button primary"
        >
          画像を保存
        </button>
      </div>

      <p id="result-message" class="message" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>UNOFFICIAL FAN CONTENT</p>
    <p>画像・氏名等の権利は各権利者に帰属します。</p>
  </footer>
</body>
</html>
